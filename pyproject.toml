[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "godric.bouteloup", email = "godric.bouteloup@epita.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
